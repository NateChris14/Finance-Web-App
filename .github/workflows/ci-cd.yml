name: CI/CD Pipeline - Build, Push, Deploy

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_FRONTEND: ${{ secrets.ECR_REPO_FRONTEND }}
  ECR_REPO_BACKEND: ${{ secrets.ECR_REPO_BACKEND }}

jobs:
  deploy:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Frontend Image
      run: |
        docker build -t $ECR_REPO_FRONTEND:latest ./frontend
        docker push $ECR_REPO_FRONTEND:latest

    - name: Build and Push Backend Image
      run: |
        docker build -t $ECR_REPO_BACKEND:latest ./backend
        docker push $ECR_REPO_BACKEND:latest

    - name: Download ECS task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ secrets.ECS_TASK_DEF_FAMILY }} \
          --query taskDefinition > task-def.json

    - name: Update task definition with new image URIs
      run: |
        jq '.containerDefinitions[] |= 
          if .name == "${{ secrets.CONTAINER_FRONTEND_NAME }}" then
            .image = "${{ secrets.ECR_REPO_FRONTEND }}:latest"
          elif .name == "${{ secrets.CONTAINER_BACKEND_NAME }}" then
            .image = "${{ secrets.ECR_REPO_BACKEND }}:latest"
          else
            .
          end' task-def.json > new-task-def.json

    - name: Register new task definition revision
      id: register-task-def
      run: |
        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://new-task-def.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

    - name: Deploy ECS Service
      run: |
        aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
          --service ${{ secrets.ECS_SERVICE_NAME }} \
          --task-definition ${{ steps.register-task-def.outputs.task_def_arn }}

name: Deploy to ECS

on:
  push:
    branches:
      - main  # or your deployment branch

env:
  AWS_REGION: eu-north-1
  ECR_FRONTEND: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/frontend-repo
  ECR_BACKEND: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/backend-repo

jobs:
  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build and push frontend Docker image
        run: |
          docker build -t $ECR_FRONTEND:latest ./frontend
          docker push $ECR_FRONTEND:latest

      - name: Build and push backend Docker image
        run: |
          docker build -t $ECR_BACKEND:latest ./backend
          docker push $ECR_BACKEND:latest

      - name: Download and clean ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEF_FAMILY }} \
            --query 'taskDefinition | {
              family: family,
              taskRoleArn: taskRoleArn,
              executionRoleArn: executionRoleArn,
              networkMode: networkMode,
              containerDefinitions: containerDefinitions,
              volumes: volumes,
              placementConstraints: placementConstraints,
              requiresCompatibilities: requiresCompatibilities,
              cpu: cpu,
              memory: memory,
              tags: tags,
              runtimePlatform: runtimePlatform
            }' > task-def.json

      - name: Sanitize null fields in task definition
        run: |
          jq 'if .tags == null then .tags = [] else . end' task-def.json > task-def-clean.json

      - name: Replace image URIs in task definition
        run: |
          jq --arg FRONTEND_IMAGE "$ECR_FRONTEND:latest" \
             --arg BACKEND_IMAGE "$ECR_BACKEND:latest" \
             '.containerDefinitions |= map(
                if .name == "frontend" then .image = $FRONTEND_IMAGE
                elif .name == "backend" then .image = $BACKEND_IMAGE
                else .
                end
              )' task-def-clean.json > task-def-updated.json

      - name: Register new ECS task definition
        id: register-task-def
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Update ECS service with new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --task-definition $NEW_TASK_DEF_ARN \
            --force-new-deployment
